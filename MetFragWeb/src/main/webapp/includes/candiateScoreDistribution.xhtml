<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
		"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	  xmlns:h="http://xmlns.jcp.org/jsf/html">

<h:body>

	<ui:composition xmlns="http://www.w3.org/1999/xhtml"
		xmlns:h="http://xmlns.jcp.org/jsf/html"
		xmlns:f="http://xmlns.jcp.org/jsf/core"
		xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
		xmlns:p="http://primefaces.org/ui">
		<h:panelGrid style="width: 100%;" columns="1"
			rendered="#{metFragWebBean.scoreDistributionModelAvailable}">
			<p:chart responsive="true" id="scoreDistributionPlot"
				widgetVar="scoreDistributionPlot" type="line"
				model="#{metFragWebBean.scoreDistributionModelView}"
				style="min-height: 500px; width: auto;" extender="extenderScore">
				<p:ajax event="itemSelect"
					listener="#{metFragWebBean.candidatesViewItemSelect}" />
				<script type="text/javascript">
					function extenderScore() {
						// Chart.js configuration
						var pointLabels = #{metFragWebBean.scoreDistributionModelPointLabels};
						
						// Configure scales
						this.cfg.options.scales = {
							x: {
								display: true,
								title: {
									display: true,
									text: 'Score'
								}
							},
							y: {
								display: true,
								title: {
									display: true,
									text: 'Candidate Index'
								},
								ticks: {
									callback: function(value, index, values) {
										return Math.floor(value);
									}
								}
							}
						};
						
						// Configure legend
						this.cfg.options.plugins = this.cfg.options.plugins || {};
						this.cfg.options.plugins.legend = {
							display: true,
							position: 'top'
						};
						
						// Configure tooltips
						this.cfg.options.plugins.tooltip = {
							enabled: true,
							callbacks: {
								title: function(context) {
									var index = context[0].dataIndex;
									if (pointLabels && index < pointLabels.length) {
										return pointLabels[index];
									}
									return 'Candidate ' + (index + 1);
								}
							}
						};
						
						// Configure zoom plugin if available
						if (typeof Chart.Zoom !== 'undefined') {
							this.cfg.options.plugins.zoom = {
								zoom: {
									wheel: {
										enabled: true,
									},
									pinch: {
										enabled: true
									},
									mode: 'y',
								},
								pan: {
									enabled: true,
									mode: 'y',
								}
							};
						}
					}
				</script>
			</p:chart>
		</h:panelGrid>
	</ui:composition>
</h:body>

</html>
